name: Finalize installer executable
on:
  push:
    branches: [installer-r57]
    paths: [.github/workflows/installer-executable.yml]
permissions:
  contents: write
jobs:
  executable:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: installer-r57
      - name: Preserve direct executable installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git update-index --chmod=+x install.sh
          git diff --cached --quiet || git commit -m "Make standalone installer executable"
          git push origin HEAD:installer-r57
